[project]
name = "chat-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pixeltable[serve]>=0.7.16",
    "anthropic>=1.3",
    "psycopg[binary]>=3.1",
    "sentence-transformers>=5.6.0",
    "torch>=2.11",
    "spacy>=3.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

# CPU wheels on Linux: the default Linux wheels add 3 GB of CUDA to every install and image, and the app runs on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
