[project]
name = "video-search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pixeltable[serve]>=0.7.16",
    "pillow>=10.0",
    "psycopg[binary]>=3.1",
    "torch>=2.11",
    "transformers>=5.6",
]

# CPU wheels on Linux: the default Linux wheels add 3 GB of CUDA to every install and image, and the app runs on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
