[project]
name = "video-search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pixeltable[serve]>=0.7.8",
    "pillow>=10.0",
    "psycopg[binary]>=3.1",
    "torch>=2.11",
    "transformers>=5.6",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
